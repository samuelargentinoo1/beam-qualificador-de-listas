# Beam — Qualificador de Listas · roda ISOLADO em containers próprios.
# O worker não expõe porta nenhuma (só faz chamadas de SAÍDA pro Supabase).
# O painel expõe SÓ a 8010 — 80/443 são do nginx dos outros sistemas do VPS.
services:
  beam:
    build: .
    container_name: beam-qualificador
    init: true                      # limpa processos-filho do Chrome direitinho
    restart: unless-stopped         # volta sozinho em reboot/queda
    env_file: .env                  # Supabase + Moskit (nunca vai pro git)
    shm_size: '1gb'                 # Chrome precisa de /dev/shm decente
    volumes:
      - ./data:/app/data            # ledger anti-repetido + perfil do Chrome
      - ./listas:/app/listas        # CSVs gerados
    environment:
      - TZ=America/Sao_Paulo

  # Painel web (substitui a Vercel): front + APIs de nuvem, falando com o Supabase.
  painel:
    build: .
    container_name: beam-painel
    command: ["node", "painel.js"]  # sem xvfb: aqui não tem Chrome
    restart: unless-stopped
    env_file: .env                  # Supabase + APP_PASSWORD
    ports:
      - "8010:8010"
    environment:
      - TZ=America/Sao_Paulo
